name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet (Linux and Windows)
        run: go vet ./... && GOOS=windows go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Build release binaries
        run: |
          scripts/build.sh
          # The Windows setup file opens no console: it is marked windowed.
          python3 -c "import struct,glob,sys; b=open(glob.glob('dist/Blackbox-Setup-*.exe')[0],'rb').read(); pe=struct.unpack_from('<I',b,0x3c)[0]; sys.exit(struct.unpack_from('<H',b,pe+92)[0]!=2)"
      - name: Report pages work in a browser (LAN and standalone demo reports)
        run: |
          npm i --no-save --prefix "$RUNNER_TEMP/pw" playwright-core@1.48.2
          BLACKBOX_DEMO_OUT="$RUNNER_TEMP/demo-lan" go test ./internal/report -run TestDemoReport -count=1
          BLACKBOX_DEMO_STANDALONE=1 BLACKBOX_DEMO_OUT="$RUNNER_TEMP/demo-sa" go test ./internal/report -run TestDemoReport -count=1
          for d in demo-lan demo-sa; do
            NODE_PATH="$RUNNER_TEMP/pw/node_modules" node scripts/browsercheck.js "$RUNNER_TEMP/$d" "$(command -v google-chrome)"
          done
  windows:
    runs-on: windows-latest
    # Receives the Linux runner's batches, so it runs after that job.
    needs: linux-live
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Tray dialogs open on the first click (TRAY1)
        run: go test ./internal/gui -run TestFirstDialogShows -v -count=1
      - name: Smoke test against this runner's live event logs
        shell: pwsh
        run: |
          go build -o blackbox.exe ./cmd/blackbox
          ./blackbox.exe check; if ($LASTEXITCODE -notin 0,3) { exit 1 }
          ./blackbox.exe collect --config none
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ./blackbox.exe report --preview --config none
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $dir = Get-ChildItem C:\ProgramData\Blackbox\reports -Directory | Select-Object -First 1
          ./blackbox.exe verify $dir.FullName
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/download-artifact@v4
        with:
          name: linux-batches
          path: linux-batches
      - name: Install as a LAN collector, receive from Linux and over SMB, run the scheduled job, uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          go run ./scripts/winres -version 0.0.0-ci
          go build -ldflags "-X main.version=0.0.0-ci" -o blackbox.exe ./cmd/blackbox
          # The setup window builds every page, and the status icon its menu.
          ./blackbox.exe setup --selftest
          if ($LASTEXITCODE -ne 0) { throw "setup window self-test failed" }
          ./blackbox.exe tray --selftest
          if ($LASTEXITCODE -ne 0) { throw "status icon self-test failed" }
          # The setup file is the same program marked windowed; run from a
          # script with a command it still answers on standard output.
          go run ./scripts/winres -windowed blackbox.exe -o Blackbox-Setup.exe
          $v = & .\Blackbox-Setup.exe version | Out-String
          if ($v.Trim() -ne "blackbox 0.0.0-ci") { throw "setup file answered '$v'" }
          function Test-Windowed($f) {
            $b = [IO.File]::ReadAllBytes((Resolve-Path $f).Path); $pe = [BitConverter]::ToInt32($b, 0x3c)
            return [BitConverter]::ToUInt16($b, $pe + 24 + 68) -eq 2
          }
          if (-not (Test-Windowed "Blackbox-Setup.exe")) { throw "setup file is not windowed" }
          if (Test-Windowed "blackbox.exe") { throw "blackbox.exe must stay a console program" }
          $r1 = Join-Path $env:RUNNER_TEMP "bb-reports"
          $r2 = Join-Path $env:RUNNER_TEMP "bb-reports-2"
          # An account other computers send as (a workgroup has no domain accounts).
          # Complex, without the account name, and 14 characters at most (or
          # net user stops to ask for confirmation).
          net user bbsend "Qx7!Harbor-L26" /add
          if ($LASTEXITCODE -ne 0) { throw "could not create the test account" }
          ./blackbox.exe install --yes --site CI --report-dir $r1 --inbox C:\BlackboxInbox --share-inbox --inbox-writer bbsend --no-first-report
          if ($LASTEXITCODE -ne 0) { throw "install failed" }
          # The collection task's trigger starts in the past (T1), so Windows
          # runs it once as soon as it is registered, and that run makes the
          # first report in the old folder. Let it finish, then start from no
          # data (settings kept), so the run below is due to make the first
          # report, in the new folder. Windows can take two minutes or more
          # to start that run, so wait up to five.
          $deadline = (Get-Date).AddMinutes(5)
          do {
            Start-Sleep 3
            $ti = Get-ScheduledTaskInfo -TaskName "Blackbox Audit Collection"
            $st = (Get-ScheduledTask -TaskName "Blackbox Audit Collection").State
          } until (($ti.LastRunTime -gt (Get-Date).AddMinutes(-10) -and $st -ne "Running") -or (Get-Date) -gt $deadline)
          Write-Host "First run at registration: $($ti.LastRunTime) ($st)"
          Get-ChildItem C:\ProgramData\Blackbox -Exclude blackbox.conf | Remove-Item -Recurse -Force
          Get-ChildItem $r1 -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force
          if (-not (Test-Path C:\BlackboxInbox\BLACKBOX-INBOX.txt)) { throw "inbox not prepared" }
          net share BlackboxInbox | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "inbox not shared" }
          $members = net localgroup "Blackbox Senders"
          if (-not ($members -match "bbsend")) { throw "bbsend not allowed to deliver: $members" }
          # A second Blackbox (its own settings and data) sends over SMB with the account.
          $s = Join-Path $env:RUNNER_TEMP "sender"
          "data_dir = $s`r`nsend_to = \\localhost\BlackboxInbox`r`nshare_user = bbsend" | Set-Content "$s.conf"
          $env:BLACKBOX_SHARE_PASSWORD = "Qx7!Harbor-L26"
          ./blackbox.exe send --config "$s.conf"
          if ($LASTEXITCODE -ne 0) { throw "send over SMB failed" }
          Remove-Item Env:BLACKBOX_SHARE_PASSWORD
          if (-not (Get-ChildItem C:\BlackboxInbox -Filter *.bbx)) { throw "no batch arrived over SMB" }
          # Batches the Linux runner's sandboxed service delivered.
          Copy-Item linux-batches\*.bbx, linux-batches\*.zip C:\BlackboxInbox\
          Write-Host "Inbox:"; Get-ChildItem C:\BlackboxInbox | Format-Table Name, Length
          $exe = "C:\Program Files\Blackbox\blackbox.exe"
          if (-not (Test-Path $exe)) { throw "program not installed" }
          schtasks /Query /TN "Blackbox Audit Collection" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "scheduled task missing" }
          # The status icon: its logon task, and the windowed copy it runs.
          $w = "C:\Program Files\Blackbox\blackboxw.exe"
          if (-not (Test-Path $w) -or -not (Test-Windowed $w)) { throw "blackboxw.exe missing or not windowed" }
          if (Test-Windowed $exe) { throw "the installed blackbox.exe must be a console program" }
          $trayXml = schtasks /Query /TN "Blackbox Status" /XML | Out-String
          if ($LASTEXITCODE -ne 0) { throw "status icon task missing" }
          $tray = [xml]($trayXml -replace '<\?xml[^>]*\?>', '')
          if ($tray.Task.Principals.Principal.GroupId -ne "S-1-5-32-544") { throw "status icon task is not for Administrators" }
          if ($tray.Task.Actions.Exec.Command -ne $w) { throw "status icon task runs $($tray.Task.Actions.Exec.Command)" }
          $key = "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\Blackbox"
          $entry = Get-ItemProperty $key
          if ($entry.DisplayVersion -ne "0.0.0-ci") { throw "Programs and Features entry missing" }
          if ($entry.Publisher -ne "Austin Case") { throw "wrong publisher: $($entry.Publisher)" }
          if ($entry.DisplayName -ne "Blackbox") { throw "wrong name in Settings > Apps: $($entry.DisplayName)" }
          if ($entry.ModifyPath -notmatch "blackboxw.exe`" setup") { throw "no Modify button: $($entry.ModifyPath)" }
          # The Apps list shows the icon embedded in the program (DisplayIcon).
          Add-Type -Namespace W -Name Shell -MemberDefinition '[DllImport("shell32.dll", CharSet=CharSet.Unicode)] public static extern uint ExtractIconEx(string f, int i, IntPtr[] l, IntPtr[] s, uint n);'
          $icons = [W.Shell]::ExtractIconEx($entry.DisplayIcon, -1, $null, $null, 0)
          if ($icons -lt 1) { throw "no icon in $($entry.DisplayIcon)" }
          $vi = (Get-Item $exe).VersionInfo
          if ($vi.CompanyName -ne "Austin Case" -or $vi.ProductVersion -ne "0.0.0-ci") { throw "version details wrong: $($vi | Format-List | Out-String)" }
          Write-Host "Icons: $icons; $($vi.FileDescription) $($vi.ProductVersion) by $($vi.CompanyName)"
          & $exe config set report_dir $r2
          if ($LASTEXITCODE -ne 0) { throw "config set failed" }
          & $exe config
          # Run the real scheduled task (as SYSTEM) and wait for the report.
          schtasks /Run /TN "Blackbox Audit Collection" | Out-Null
          $deadline = (Get-Date).AddMinutes(4)
          while (-not (Get-ChildItem $r2 -Recurse -Filter summary.json -ErrorAction SilentlyContinue)) {
            if ((Get-Date) -gt $deadline) { Get-Content C:\ProgramData\Blackbox\blackbox.log -ErrorAction SilentlyContinue; throw "no report written by the scheduled task" }
            Start-Sleep 5
          }
          Start-Sleep 3
          Get-Content C:\ProgramData\Blackbox\blackbox.log | Select-Object -Last 15
          Write-Host "Scheduled task wrote a report to $r2"
          $dir = (Get-ChildItem $r2 -Recurse -Filter summary.json | Select-Object -First 1).DirectoryName
          $sum = Get-Content "$dir\summary.json" | ConvertFrom-Json
          $sum.systems | Format-Table name, status, events, high, audit_settings_failing
          $linux = $sum.systems | Where-Object { $_.name -ne $env:COMPUTERNAME }
          if (-not $linux) { throw "the Linux computer's events are not in the collector's report" }
          # Every system here collected just now. Old events carrying the image's
          # build-time computer name must not show up as a silent system.
          if ($sum.systems | Where-Object { $_.status -eq "silent" }) { throw "a system is wrongly reported as silent" }
          if (-not (Select-String -Path "$dir\report.html" -Pattern 'data-view="systems"' -Quiet)) { throw "report has no Systems page" }
          # The inventory read with the settings check (PowerShell CIM, as SYSTEM).
          if (-not (Select-String -Path "$dir\report.html" -Pattern "Accounts on $env:COMPUTERNAME" -SimpleMatch -Quiet)) { throw "no inventory for this computer in the report" }
          if (Get-ChildItem C:\BlackboxInbox -Filter *.bbx) { throw "batches left in the inbox after import" }
          # The report folder holds the original logs: this computer's own
          # (.evtx, exported as SYSTEM) and the Linux one's.
          $zips = Get-ChildItem $dir -Filter logs-*.zip
          $zips | Format-Table Name, Length
          if ($zips.Count -lt 2) { throw "expected this computer's and the Linux computer's original logs in the report folder" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $own = $zips | Where-Object { $_.Name -eq "logs-$env:COMPUTERNAME.zip" } | Select-Object -First 1
          if (-not $own) { throw "no zip of this computer's own logs" }
          # The zip takes the report folder's permissions, like report.html, not
          # the data folder's (Administrators and SYSTEM only).
          $zipAcl = (Get-Acl $own.FullName).Sddl; $htmlAcl = (Get-Acl "$dir\report.html").Sddl
          if ($zipAcl -ne $htmlAcl) { throw "the logs zip has different permissions from the report: $zipAcl vs $htmlAcl" }
          $names = [IO.Compression.ZipFile]::OpenRead($own.FullName).Entries.Name
          if (-not ($names | Where-Object { $_ -like "Security*.evtx" })) { throw "Security.evtx not archived: $names" }
          if ($sum.log_archives.Count -lt 2) { throw "report does not list the log archives" }
          & $exe verify $dir
          if ($LASTEXITCODE -ne 0) { throw "report folder does not match its manifest" }
          & $exe status
          # Upgrade in place with a newer build, turning the status icon off:
          # the running programs are renamed, not overwritten.
          go build -ldflags "-X main.version=0.0.1-ci" -o blackbox-new.exe ./cmd/blackbox
          ./blackbox-new.exe install --yes --tray=false --no-first-report
          if ($LASTEXITCODE -ne 0) { throw "upgrade failed" }
          if ((& $exe version) -ne "blackbox 0.0.1-ci") { throw "upgrade did not replace the program" }
          if ((Get-ItemProperty $key).DisplayVersion -ne "0.0.1-ci") { throw "Programs and Features still shows the old version" }
          schtasks /Query /TN "Blackbox Status" 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "status icon task not removed when turned off" }
          & $exe uninstall
          $deadline = (Get-Date).AddSeconds(60)
          while (Test-Path "C:\Program Files\Blackbox") {
            if ((Get-Date) -gt $deadline) { Get-ChildItem "C:\Program Files\Blackbox"; throw "program folder not removed" }
            Start-Sleep 2
          }
          if (Test-Path $key) { throw "Programs and Features entry not removed" }
          schtasks /Query /TN "Blackbox Audit Collection" 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "scheduled task not removed" }
          net share BlackboxInbox 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "inbox share not removed" }
          # The senders' group is kept, so a reinstall doesn't lock out a
          # sender whose connection still carries it.
          net localgroup "Blackbox Senders" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "the Blackbox Senders group was removed" }
          schtasks /Query /TN "Blackbox Status" 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "status icon task not removed by uninstall" }
          $global:LASTEXITCODE = 0
      - name: The release setup file installs the console program it carries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # As the release builds it (unsigned here): the console program
          # travels inside the setup file and is installed unchanged (A10).
          $env:VERSION = "0.0.2-ci"
          bash scripts/build.sh
          if ($LASTEXITCODE -ne 0) { throw "build failed" }
          if (-not (Test-Path dist/blackbox-0.0.2-ci.spdx.json)) { throw "no SBOM" }
          $setup = (Resolve-Path dist/Blackbox-Setup-0.0.2-ci.exe).Path
          $p = Start-Process -Wait -PassThru -FilePath $setup -ArgumentList "install", "--yes", "--site", "CI2", "--no-first-report", "--tray=false"
          if ($p.ExitCode -ne 0) { throw "setup file install failed: $($p.ExitCode)" }
          $exe = "C:\Program Files\Blackbox\blackbox.exe"
          if ((& $exe version) -ne "blackbox 0.0.2-ci") { throw "installed program answered the wrong version" }
          $b = [IO.File]::ReadAllBytes($exe); $pe = [BitConverter]::ToInt32($b, 0x3c)
          if ([BitConverter]::ToUInt16($b, $pe + 24 + 68) -ne 3) { throw "installed blackbox.exe is not a console program" }
          # The carried copy is the program alone: well under the setup file's size.
          if ($b.Length -gt (Get-Item $setup).Length * 0.75) { throw "blackbox.exe was made from the setup file, not the copy it carries" }
          & $exe uninstall
          $global:LASTEXITCODE = 0
  linux-live:
    # End-to-end on a real Ubuntu machine: install auditd with Blackbox's
    # recommended rules, make some changes an auditor must see, then
    # collect, report and check the report says so.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build -o blackbox ./cmd/blackbox
      - name: Install auditd with the recommended rules
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq auditd
          sudo systemctl start auditd
          ./blackbox check --audit-rules | sudo tee /etc/audit/rules.d/zz-blackbox.rules > /dev/null
          sudo augenrules --load
          sudo auditctl -s
          # --missing keeps the rules in its own file and adds nothing twice.
          sudo ./blackbox check --audit-rules --missing > missing.rules
          test "$(grep -c -- 'path=/etc/sudoers ' missing.rules)" -le 1
      - name: Make changes an auditor must see
        run: |
          sudo useradd -m bbtestuser
          sudo usermod -aG sudo bbtestuser
          echo 'bbtestuser ALL=(ALL) NOPASSWD: ALL' | sudo tee /etc/sudoers.d/bbtestuser > /dev/null
          sleep 2
      - name: Check, collect, report and verify
        run: |
          printf 'data_dir = %s/bbdata\n' "$PWD" > ci.conf
          sudo ./blackbox check --all || [ $? -eq 3 ]
          sudo ./blackbox collect --config ci.conf
          sudo ./blackbox report --preview --config ci.conf
          dir=$(sudo sh -c 'ls -d bbdata/reports/*/' | head -1)
          sudo ./blackbox verify "$dir"
          for want in "created the user account bbtestuser" "added bbtestuser to the privileged group sudo" "changed the sudo rules: /etc/sudoers.d/bbtestuser"; do
            if ! sudo unzip -p "$dir/events.zip" events.csv | grep -q "$want"; then
              echo "report is missing: $want"
              sudo unzip -p "$dir/events.zip" events.csv | cut -c1-200 | head -40
              echo "--- account-related audit records:"
              sudo grep -E 'type=(ADD_USER|ADD_GROUP|USER_MGMT|GRP_MGMT|USER_CHAUTHTOK)' /var/log/audit/audit.log | tail -20
              exit 1
            fi
          done
          echo "All expected events found."
          # The event pages read their events from compressed data files.
          sudo sh -c "ls $dir/data/*.js" | head -5
          sudo sh -c "grep -q 'BB.put(\"privileged/' $dir/data/privileged-*.js" || { echo "no event data files"; exit 1; }
      - name: Install, change report folder, run the scheduled job, uninstall
        run: |
          sudo ./blackbox install --yes --site CI --report-dir /srv/bb-reports --no-first-report
          systemctl is-enabled blackbox.timer
          # The timer may already have run (OnBootSec has passed on a runner
          # that booted minutes ago) and made the first report in the old
          # folder. Stop it and start from no data, so the run below is due
          # to make the first report, in the new folder.
          sudo systemctl stop blackbox.timer
          # A oneshot run the timer started is "activating", which
          # is-active does not count: wait until it is neither.
          while case "$(systemctl is-active blackbox.service)" in active|activating|deactivating) true;; *) false;; esac; do sleep 1; done
          sudo rm -rf /var/lib/blackbox /srv/bb-reports/*
          sudo ./blackbox config set report_dir /srv/bb-reports-2
          grep -q "ReadWritePaths=.*/srv/bb-reports-2" /etc/systemd/system/blackbox.service
          sudo /usr/local/bin/blackbox config
          # Run the real (sandboxed) service once and check it wrote a report.
          sudo systemctl start blackbox.service || { sudo journalctl -u blackbox.service --no-pager | tail -40; exit 1; }
          sudo find /srv/bb-reports-2 -name report.html | grep -q report.html || { sudo journalctl -u blackbox.service --no-pager | tail -30; exit 1; }
          echo "Sandboxed service wrote a report to /srv/bb-reports-2"
          # The inventory read with the settings check, from inside the sandbox.
          sudo sh -c "grep -q 'Accounts on $(hostname)' /srv/bb-reports-2/*/report.html" || { echo "no inventory in the report"; exit 1; }
          # The report folder holds the original logs, in its manifest.
          sudo sh -c 'ls /srv/bb-reports-2/*/logs-*.zip' || { sudo journalctl -u blackbox.service --no-pager | tail -30; exit 1; }
          sudo sh -c 'unzip -l /srv/bb-reports-2/*/logs-*.zip' | grep -q audit.log
          sudo sh -c 'grep -q "logs-" /srv/bb-reports-2/*/manifest.sha256'
          sudo sh -c 'for d in /srv/bb-reports-2/*/; do ./blackbox verify "$d"; done'
          sudo ./blackbox uninstall
          if systemctl is-enabled blackbox.timer 2>/dev/null; then echo "timer not removed"; exit 1; fi
          # Start the sender below from scratch (its first archive is due at once).
          sudo rm -rf /var/lib/blackbox
      - name: "LAN: send to a collector's SMB share from the sandboxed service"
        run: |
          sudo apt-get install -y -qq samba cifs-utils
          # A Linux collector on this machine; its first run prepares the inbox.
          printf 'data_dir = /tmp/col\nreport_dir = /tmp/col/reports\ninbox = /srv/inbox\n' > col.conf
          sudo ./blackbox run --config col.conf
          # The inbox is root-only, so these checks run as root.
          sudo test -f /srv/inbox/BLACKBOX-INBOX.txt
          # Share the inbox with an account, as a Windows collector would.
          sudo useradd -M -s /usr/sbin/nologin bbsend
          printf 'Bb-Sender-CI-2026!\nBb-Sender-CI-2026!\n' | sudo smbpasswd -a -s bbsend
          sudo chown bbsend /srv/inbox
          printf '[inbox]\n  path = /srv/inbox\n  valid users = bbsend\n  writable = yes\n' | sudo tee -a /etc/samba/smb.conf > /dev/null
          sudo systemctl restart smbd
          # Install as a sender to the share; the password is stored root-only.
          sudo BLACKBOX_SHARE_PASSWORD='Bb-Sender-CI-2026!' ./blackbox install --yes --send-to //127.0.0.1/inbox --share-user bbsend --no-first-report
          sudo test "$(sudo stat -c %a /etc/blackbox/share.cred)" = 600
          grep -q "Wants=var-lib-blackbox-collector.mount" /etc/systemd/system/blackbox.service
          # A sender also delivers when the computer shuts down.
          systemctl is-enabled blackbox-shutdown.service
          # The sandboxed service (no network of its own) mounts the share and delivers.
          sudo systemctl start blackbox.service || { sudo journalctl -u blackbox.service -u var-lib-blackbox-collector.mount --no-pager | tail -40; exit 1; }
          sudo /usr/local/bin/blackbox status
          sudo sh -c 'ls /srv/inbox/*.bbx' || { sudo journalctl -u blackbox.service -u var-lib-blackbox-collector.mount --no-pager | tail -40; exit 1; }
          # The original logs came too.
          sudo sh -c 'ls /srv/inbox/archive_*.zip' || { echo "no log archive delivered"; exit 1; }
          # Hand these batches to the Windows job, then import them here too.
          mkdir linux-batches && sudo sh -c 'cp /srv/inbox/*.bbx /srv/inbox/archive_*.zip linux-batches/' && sudo chown -R "$USER" linux-batches
          sudo ./blackbox report --preview --config col.conf
          if sudo sh -c 'ls /srv/inbox/*.bbx /srv/inbox/*.zip' 2>/dev/null; then echo "batches or archives not imported"; exit 1; fi
          sudo sh -c 'ls /tmp/col/archives/*/*.zip' || { echo "log archive not kept for the collector's next report"; exit 1; }
          sudo ./blackbox status --config col.conf
          sudo ./blackbox uninstall
          sudo test ! -e /etc/systemd/system/var-lib-blackbox-collector.mount
          sudo test ! -e /etc/blackbox/share.cred
          sudo test ! -e /etc/systemd/system/blackbox-shutdown.service
      - name: "LAN: send to a mounted folder from blackbox-send.service; an unreachable folder never stops collection (L8)"
        run: |
          # The collector's inbox from the step above, as a folder the site mounted.
          sudo ./blackbox install --yes --send-to /srv/inbox --no-first-report
          grep -q "run --no-deliver" /etc/systemd/system/blackbox.service
          if grep -q "/srv/inbox" /etc/systemd/system/blackbox.service /etc/systemd/system/blackbox-shutdown.service; then echo "a unit names the collector's folder"; exit 1; fi
          grep -q "ExecStart=/usr/local/bin/blackbox send" /etc/systemd/system/blackbox-send.service
          sudo systemctl start blackbox.service || { sudo journalctl -u blackbox.service --no-pager | tail -40; exit 1; }
          for i in $(seq 1 60); do sudo sh -c 'ls /srv/inbox/*.bbx' >/dev/null 2>&1 && break; sleep 1; done
          sudo sh -c 'ls /srv/inbox/*.bbx' || { sudo journalctl -u blackbox.service -u blackbox-send.service --no-pager | tail -40; exit 1; }
          # The folder goes away: collection still runs, the data waits.
          sudo mv /srv/inbox /srv/inbox-away
          sudo systemctl start blackbox.service || { echo "collection stopped with the collector unreachable"; sudo journalctl -u blackbox.service --no-pager | tail -40; exit 1; }
          sleep 5
          sudo /usr/local/bin/blackbox status || true
          sudo /usr/local/bin/blackbox status | grep -q "Waiting to send" || { echo "status does not say data is waiting"; exit 1; }
          sudo mv /srv/inbox-away /srv/inbox
          sudo ./blackbox uninstall
          sudo test ! -e /etc/systemd/system/blackbox-send.service
      - name: "LAN: blackbox-send.service remounts a stopped sshfs mount from inside its sandbox (L12)"
        run: |
          # An SFTP route as sites set it up: an sshfs line in /etc/fstab.
          sudo apt-get install -y -qq sshfs openssh-server
          sudo systemctl start ssh
          sudo useradd -m -s /bin/bash bbsftp
          sudo mkdir -p /root/.ssh /home/bbsftp/.ssh
          sudo ssh-keygen -q -t ed25519 -N '' -f /root/.ssh/bb_sftp
          sudo cp /root/.ssh/bb_sftp.pub /home/bbsftp/.ssh/authorized_keys
          sudo chown -R bbsftp: /home/bbsftp/.ssh /srv/inbox
          sudo chmod 700 /home/bbsftp/.ssh
          sudo mkdir -p /srv/blackbox-sftp
          echo 'bbsftp@127.0.0.1:/srv/inbox /srv/blackbox-sftp fuse.sshfs noauto,IdentityFile=/root/.ssh/bb_sftp,StrictHostKeyChecking=accept-new,reconnect 0 0' | sudo tee -a /etc/fstab > /dev/null
          # Over localhost, so no _netdev: the runner's network-online.target
          # wait job fails. Not under /mnt: that is the runner's own (failed)
          # mount unit.
          sudo systemctl daemon-reload
          sudo systemctl start 'srv-blackbox\x2dsftp.mount' || { systemctl --failed --no-pager; sudo journalctl -u 'srv-blackbox\x2dsftp.mount' --no-pager | tail -20; exit 1; }
          sudo test -f /srv/blackbox-sftp/BLACKBOX-INBOX.txt
          sudo rm -f /srv/inbox/*.bbx
          sudo ./blackbox install --yes --send-to /srv/blackbox-sftp --no-first-report
          grep -q 'ExecStartPre=-+/usr/bin/systemctl start "srv-blackbox\\\\x2dsftp.mount"' /etc/systemd/system/blackbox-send.service
          # The collector goes away and comes back: the mount is down when the send runs.
          sudo systemctl stop 'srv-blackbox\x2dsftp.mount'
          if findmnt /srv/blackbox-sftp; then echo "still mounted"; exit 1; fi
          sudo systemctl start blackbox.service || { sudo journalctl -u blackbox.service --no-pager | tail -40; exit 1; }
          sudo systemctl start blackbox-send.service || true
          for i in $(seq 1 60); do sudo sh -c 'ls /srv/inbox/*.bbx' >/dev/null 2>&1 && break; sleep 1; done
          sudo sh -c 'ls /srv/inbox/*.bbx' || { echo "not delivered after the remount"; sudo journalctl -u blackbox-send.service -u 'srv-blackbox\x2dsftp.mount' --no-pager | tail -40; exit 1; }
          # Mounted by systemd, so the mount outlives the send.
          findmnt /srv/blackbox-sftp || { echo "the mount ended with the send"; exit 1; }
          sudo ./blackbox uninstall
          sudo systemctl stop 'srv-blackbox\x2dsftp.mount'
      - uses: actions/upload-artifact@v4
        with:
          name: linux-batches
          path: linux-batches
          retention-days: 1
